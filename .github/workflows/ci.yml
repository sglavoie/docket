name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main keeps
# every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.10.0

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # What `just check` runs.
      - name: Format
        run: test -z "$(gofmt -l main.go internal tools)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  # What `just lint` runs, and what no other check covers: the module files
  # say exactly what the code imports, and nothing it calls has a known
  # vulnerability. govulncheck is reachability-aware, and scans the standard
  # library of the Go version go.mod declares.
  lint:
    name: Lint and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@"$GOVULNCHECK_VERSION"

      - name: Lint
        run: golangci-lint run ./...

      - name: Module files are tidy
        if: ${{ !cancelled() }}
        run: go mod tidy -diff

      - name: Known vulnerabilities
        if: ${{ !cancelled() }}
        run: govulncheck ./...

  # The README animation is recorded from TestReadmeDemo, so a change to what
  # the app draws must re-record it with `just readme-media`.
  readme-media:
    name: README animation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check the committed animation is current
        run: ./scripts/readme_media.sh --check

  macos-shell:
    name: macOS desktop shell
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GHOSTTYKIT_TARGET: native
      DOCKET_MACOS_RESULTS: ${{ github.workspace }}/macos-results
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: brew install just

      - name: Identify Apple toolchain
        id: toolchain
        shell: bash
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache pinned desktop dependencies
        uses: actions/cache@v6
        with:
          path: |
            macos/Vendor
            macos/.cache/zig
            macos/.cache/xcodegen-*
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('macos/GHOSTTY_VERSION', 'macos/XCODEGEN_VERSION', 'macos/patches/ghostty/**', 'macos/scripts/build-ghosttykit.sh', 'macos/scripts/resolve-xcodegen.sh') }}

      - name: Build and test the desktop shell
        run: just mac-test

      - name: Keep desktop test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-results
          path: macos-results
          if-no-files-found: warn
