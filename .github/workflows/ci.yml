name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          THRESHOLD=$(cat .coverage-threshold)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
          MARGIN=5
          if [ "$(echo "$COVERAGE >= $THRESHOLD + $MARGIN" | bc)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% exceeds threshold by ${MARGIN}%+. Consider increasing .coverage-threshold."
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Build
        run: go build -v ./...
