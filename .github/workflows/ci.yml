name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Check coverage threshold
        run: |
          THRESHOLD=$(cat .coverage-threshold)
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < $THRESHOLD" | bc)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
          MARGIN=5
          if [ "$(echo "$COVERAGE >= $THRESHOLD + $MARGIN" | bc)" -eq 1 ]; then
            echo "Coverage ${COVERAGE}% exceeds threshold by ${MARGIN}%+. Consider increasing .coverage-threshold."
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0

  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the changes"
            exit 1
          fi

  deadcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install deadcode
        run: go install golang.org/x/tools/cmd/deadcode@latest

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Check for dead code
        run: |
          OUTPUT=$(deadcode -test ./... 2>&1 || true)
          if [ -n "$OUTPUT" ]; then
            echo "Dead code detected:"
            echo "$OUTPUT"
            exit 1
          fi
          echo "No dead code found"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Generate CLI reference
        run: go run ./scripts/gen-api-ref > cmd/cli-reference.md

      - name: Build
        run: go build -v ./...
