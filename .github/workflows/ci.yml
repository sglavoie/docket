name: CI

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; v2 keeps
# every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # What `just check` runs.
      - name: Format
        run: test -z "$(gofmt -l main.go internal tools)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  macos-shell:
    name: macOS desktop shell
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GHOSTTYKIT_TARGET: native
      DOCKET_MACOS_RESULTS: ${{ github.workspace }}/macos-results
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: brew install just

      - name: Identify Apple toolchain
        id: toolchain
        shell: bash
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache pinned desktop dependencies
        uses: actions/cache@v6
        with:
          path: |
            macos/Vendor
            macos/.cache/zig
            macos/.cache/xcodegen-*
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('macos/GHOSTTY_VERSION', 'macos/XCODEGEN_VERSION', 'macos/patches/ghostty/**', 'macos/scripts/build-ghosttykit.sh', 'macos/scripts/resolve-xcodegen.sh') }}

      - name: Build and test the desktop shell
        run: just mac-test

      - name: Keep desktop test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-results
          path: macos-results
          if-no-files-found: warn
