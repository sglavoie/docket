name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DEADCODE_VERSION: v0.44.0
  GOLANGCI_LINT_VERSION: v2.12.2

jobs:
  ci:
    name: CI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned deadcode
        run: go install golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}

      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Run repository CI gate
        run: ./scripts/ci.sh
