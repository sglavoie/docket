name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release workflow runs every check before it builds.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks; main keeps
# every run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEADCODE_VERSION: v0.44.0
  GOLANGCI_LINT_VERSION: v2.12.2
  GOVULNCHECK_VERSION: v1.7.0

# The repository gate is split so no runner holds the whole suite: `ci.sh
# checks` once per platform, the race tests in shards per platform, and one
# coverage judgment over every Linux shard's profile. `just ci` still runs all
# of it in one process tree.
#
# setup-go saves its cache only after a successful job, so a red main never
# wrote one and every run compiled cold. These jobs restore their own cache per
# role and save it on main whatever the outcome, keyed on the module graph: the
# dependencies' race and lint builds are what stays hot between commits.
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/golangci-lint
            ~/Library/Caches/golangci-lint
          key: go-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-checks-${{ runner.os }}-${{ runner.arch }}-

      - name: Install pinned deadcode
        run: go install golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}

      - name: Install pinned golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}

      - name: Run repository checks
        run: ./scripts/ci.sh checks

      # Reachability-aware, so it reports only vulnerabilities this code can
      # actually call. The Go version it scans the standard library against is
      # the one go.mod declares, which is why that directive is a security floor
      # rather than a convenience.
      - name: Check known vulnerabilities
        if: ${{ !cancelled() }}
        run: govulncheck ./...

      - name: Save Go caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
            ~/.cache/golangci-lint
            ~/Library/Caches/golangci-lint
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Each shard drains its slice of the long poles' chunks and of the other
  # packages (see test_race.sh). macOS takes one shard fewer because a public
  # repository runs at most five macOS jobs at once.
  test:
    name: Race tests (${{ matrix.os }}, ${{ matrix.shard }}/${{ matrix.shards }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shards: 4, shard: 0 }
          - { os: ubuntu-latest, shards: 4, shard: 1 }
          - { os: ubuntu-latest, shards: 4, shard: 2 }
          - { os: ubuntu-latest, shards: 4, shard: 3 }
          - { os: macos-latest, shards: 3, shard: 0 }
          - { os: macos-latest, shards: 3, shard: 1 }
          - { os: macos-latest, shards: 3, shard: 2 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Restore Go caches
        id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-

      # Coverage is judged once, from the Linux shards; instrumenting the macOS
      # shards as well would only slow them.
      - name: Run this shard's race tests
        env:
          TT_SHARD_INDEX: ${{ matrix.shard }}
          TT_SHARD_COUNT: ${{ matrix.shards }}
        run: ./scripts/test_race.sh ${{ runner.os == 'Linux' && 'coverage.out' || '' }}

      - name: Keep this shard's coverage
        if: ${{ runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.shard }}
          path: coverage.out
          retention-days: 1

      - name: Save Go caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.go-cache.outputs.cache-hit != 'true' && matrix.shard == 0 }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/Library/Caches/go-build
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Collect every shard's coverage
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: shards

      - name: Check coverage thresholds
        run: |
          ./scripts/merge_coverage.sh coverage.out shards/*/coverage.out
          ./scripts/check_coverage.sh coverage.out

  # The iPhone app on an iOS simulator, beside the Go gate above, which it
  # does not repeat: the Swift unit, bridge, and sync suites, the whole UI
  # suite, and the accessibility suite again on a small-screen simulator.
  # Every result bundle, summary, and screenshot is kept as an artifact.
  # Disabled for now: the UI suite outgrew its 5400s qualification timeout and
  # six UI tests fail. Remove `if: false` once both are fixed.
  ios:
    name: iOS simulator
    if: false
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      TT_IOS_RESULTS: ${{ github.workspace }}/ios-results
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Pinned app upgrade and old-schema compatibility builds.

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: brew install just

      - name: Qualification runner checks
        run: python3 -m unittest discover -s ios/scripts -p 'test*qualification*.py'

      - name: Unattended simulator qualification
        run: just ios-qualify run "$TT_IOS_RESULTS/qualification"

      - name: Accessibility suite on a small screen
        run: just ios-ui-test AccessibilityUITests small

      - name: Keep result bundles, summaries, and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-results
          path: ios-results
          if-no-files-found: warn

  macos-shell:
    name: macOS desktop shell
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      GHOSTTYKIT_TARGET: native
      TT_MACOS_RESULTS: ${{ github.workspace }}/macos-results
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install just
        run: brew install just

      - name: Identify Apple toolchain
        id: toolchain
        shell: bash
        run: |
          fingerprint=$( { xcodebuild -version; xcrun --sdk macosx --show-sdk-version; } | shasum -a 256 | cut -d ' ' -f 1)
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Cache pinned desktop dependencies
        uses: actions/cache@v6
        with:
          path: |
            macos/Vendor
            macos/.cache/zig
            macos/.cache/xcodegen-*
          key: desktop-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ hashFiles('macos/GHOSTTY_VERSION', 'macos/XCODEGEN_VERSION', 'macos/patches/ghostty/**', 'macos/scripts/build-ghosttykit.sh', 'macos/scripts/resolve-xcodegen.sh') }}

      - name: Build and test the desktop shell
        run: just mac-test

      - name: Keep desktop test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-results
          path: macos-results
          if-no-files-found: warn

  cross-machine:
    name: Cross-machine compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Schema-19 build: the older reader and migration source under test.
      TT_OLD_BINARY_REF: 08c0cb08fec10154e6d2c9455e32d4c4ffa5f72d
      TT_REQUIRE_NO_SKIPS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Exercise real-process and older-binary compatibility
        run: ./scripts/cross_machine_gate.sh

  # The README animation is recorded from TestReadmeDemo, so a change to what
  # the app draws must re-record it with `just readme-media`.
  readme-media:
    name: README animation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Check the committed animation is current
        run: ./scripts/readme_media.sh --check
