# XcodeGen spec for Docket.app. `just mac-app` generates macos/Docket.xcodeproj from it;
# the generated project is gitignored, so edit this file instead.
name: Docket
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Shared by the app and its widget extension, whose versions must match.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Docket:
    type: application
    platform: macOS
    sources:
      - path: DocketApp
        excludes:
          - Resources/docket-launch
          - Resources/Docket.entitlements
      # Link routes and the pulse snapshot, compiled into the widget too.
      - path: Shared
      # The launcher Docket runs under, copied executable into Resources.
      - path: DocketApp/Resources/docket-launch
        buildPhase: resources
      # Shown in the About panel.
      - path: NOTICE-ghostty
        buildPhase: resources
      # Ghostty's themes, shell integration, and terminfo, found by libghostty
      # beside the terminfo sentinel; vendored by build-ghosttykit.sh.
      - path: Vendor/resources/ghostty
        type: folder
        buildPhase: resources
      - path: Vendor/resources/terminfo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Docket
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.docket
        INFOPLIST_FILE: DocketApp/Resources/Info.plist
        # The App Group the widget reads the pulse from; sign.sh signs with it too.
        CODE_SIGN_ENTITLEMENTS: DocketApp/Resources/Docket.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # libghostty.a is built by Zig and carries C++ objects but no autolink
        # entries, so its runtime dependencies are spelled here.
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      # Static library: linked, never embedded. Its Headers/module.modulemap
      # exposes `import GhosttyKit`, so no bridging header is needed.
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: WidgetKit.framework
      # Embedded in Contents/PlugIns.
      - target: DocketWidgets
    scheme:
      testTargets:
        - DocketAppTests
  DocketWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: DocketWidgets
        excludes:
          - DocketWidgets.entitlements
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: DocketWidgets
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.docket.widgets
        INFOPLIST_FILE: DocketWidgets/Info.plist
        # Sandboxed, as WidgetKit requires, with the app's App Group.
        CODE_SIGN_ENTITLEMENTS: DocketWidgets/DocketWidgets.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  DocketAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DocketAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.docket.tests
    dependencies:
      - target: Docket
      # For `import GhosttyKit` in tests. The hosting app already links the
      # static library, so linking it again would duplicate its symbols.
      - framework: Vendor/GhosttyKit.xcframework
        link: false
        embed: false
