# XcodeGen spec for tt.app. `just mac-app` generates macos/tt.xcodeproj from it;
# the generated project is gitignored, so edit this file instead.
name: tt
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  tt:
    type: application
    platform: macOS
    sources:
      - path: TTApp
    settings:
      base:
        PRODUCT_NAME: tt
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt
        INFOPLIST_FILE: TTApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # libghostty.a is built by Zig and carries C++ objects but no autolink
        # entries, so its runtime dependencies are spelled here.
        OTHER_LDFLAGS: ["-lc++"]
    dependencies:
      # Static library: linked, never embedded. Its Headers/module.modulemap
      # exposes `import GhosttyKit`, so no bridging header is needed.
      - framework: Vendor/GhosttyKit.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: Carbon.framework
      - sdk: ServiceManagement.framework
      - sdk: CoreText.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
    scheme:
      testTargets:
        - TTAppTests
  TTAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TTAppTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.tests
    dependencies:
      - target: tt
