# Builds release binaries when a v* tag is pushed (.github/workflows/release.yml).
# Check locally with `goreleaser check` and `goreleaser release --snapshot --clean`.
version: 2

project_name: docket

before:
  hooks:
    - go mod tidy -diff
    # Shell completions, shipped in the archives and installed by the cask.
    # Each script also completes dkt; fish finds completions by command name,
    # so dkt gets a file of its own that wraps docket's.
    - sh -c 'rm -rf completions && mkdir completions && for sh in bash zsh fish; do go run . completion "$sh" > "completions/docket.$sh"; done && echo "complete -c dkt -w docket" > completions/dkt.fish'

builds:
  - binary: docket
    env:
      - CGO_ENABLED=0
    # Windows is not supported.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      # The tag keeps its v, matching what `go install …@v0.1.0` reports.
      - -X github.com/sglavoie/docket/cmd.Version={{ .Tag }}
      - -X github.com/sglavoie/docket/cmd.GitCommit={{ .ShortCommit }}
      - -X github.com/sglavoie/docket/cmd.BuildTime={{ .Date }}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - completions/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      # With or without a scope, as in chore(deps): from Dependabot.
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"

homebrew_casks:
  - name: docket
    repository:
      owner: sglavoie
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://github.com/sglavoie/docket
    description: Local-first, keyboard-driven task manager for the terminal
    license: MIT
    # The second entry also links docket as the short alias dkt. binaries
    # takes names only and custom_block lands above version, which fails
    # brew style's stanza order, so the target rides in the quoted name.
    binaries:
      - docket
      - 'docket", target: "dkt'
    # completions takes one file per shell. zsh and bash register dkt inside
    # docket's script; fish needs dkt.fish too, which rides the quoted path
    # as a second stanza, the way dkt rides binaries above.
    completions:
      bash: completions/docket.bash
      zsh: completions/docket.zsh
      fish: |-
        completions/docket.fish"
          fish_completion "completions/dkt.fish
    hooks:
      post:
        # The binaries are not notarized: let macOS run them.
        # install_steps writes Homebrew's postflight_steps; install wrote the
        # deprecated postflight, which warns on every install.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/docket"]
          end
