# XcodeGen spec for the iPhone app. ios/scripts/generate-project.sh builds the
# Go bridge and generates ios/TTMobile.xcodeproj from this file with the
# XcodeGen macos/XCODEGEN_VERSION pins; the generated project is gitignored,
# so edit this file instead.
name: TTMobile
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  # The typed engine adapter and the gomobile XCFramework it wraps.
  TTEngine:
    path: TTEngine
  # The exchange transport shared with the macOS helper.
  TTSync:
    path: ../apple/TTSync
  # Local notifications for check-ins, timed deadlines, and deferrals.
  TTReminders:
    path: TTReminders
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  TTMobile:
    type: application
    platform: iOS
    sources:
      - path: TTMobile
    settings:
      base:
        PRODUCT_NAME: tt
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: tt
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: TTEngine
        product: TTEngine
      - package: TTSync
        product: TTSync
      - package: TTReminders
        product: TTReminders
    scheme:
      testTargets:
        - TTMobileDeviceTests
        - TTMobileUITests
  # Hosted in the app, so it runs with the app's container and the exchange
  # folder bookmark the document picker left there. Physical iPhone only:
  # ios/scripts/record-icloud-exchange.sh drives it.
  TTMobileDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TTMobileDeviceTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.devicetests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/tt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/tt
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: TTMobile
      - package: TTEngine
        product: TTEngine
      - package: TTSync
        product: TTSyncContract
  # Seeded browsing UI tests on a simulator against the real gomobile engine.
  # ios/scripts/test-ui.sh prepares the disposable workspaces and runs them.
  TTMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TTMobileUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.uitests
        TEST_TARGET_NAME: TTMobile
    dependencies:
      - target: TTMobile
