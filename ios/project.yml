# XcodeGen spec for the iPhone app. ios/scripts/generate-project.sh builds the
# Go bridge and generates ios/TTMobile.xcodeproj from this file with the
# XcodeGen macos/XCODEGEN_VERSION pins; the generated project is gitignored,
# so edit this file instead.
name: TTMobile
options:
  bundleIdPrefix: io.github.sglavoie
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  # The typed engine adapter and the gomobile XCFramework it wraps.
  TTEngine:
    path: TTEngine
  # The exchange transport shared with the macOS helper.
  TTSync:
    path: ../apple/TTSync
  # Local notifications for check-ins, timed deadlines, and deferrals.
  TTReminders:
    path: TTReminders
  # The capture inbox, widget snapshot, and deep links the app shares with
  # its share extension, widgets, and shortcuts through the App Group.
  TTShared:
    path: TTShared
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  TTMobile:
    type: application
    platform: iOS
    sources:
      - path: TTMobile
    settings:
      base:
        PRODUCT_NAME: tt
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/TTMobile-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TTMobile.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: tt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: TTEngine
        product: TTEngine
      - package: TTSync
        product: TTSync
      - package: TTReminders
        product: TTReminders
      - package: TTShared
        product: TTShared
      - target: TTShare
        embed: true
      - target: TTWidgets
        embed: true
    scheme:
      testTargets:
        - TTMobileTests
        - TTMobileDeviceTests
        - TTMobileUITests
  # The share sheet's tt entry: saves what was shared to the App Group
  # capture inbox and never opens the workspace.
  TTShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TTShare
    settings:
      base:
        PRODUCT_NAME: TTShare
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.share
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/TTShare-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: tt
        CODE_SIGN_ENTITLEMENTS: Config/TTShare.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: TTShared
        product: TTShared
  # Today and Inbox widgets drawn from the App Group snapshot.
  TTWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TTWidgets
    settings:
      base:
        PRODUCT_NAME: TTWidgets
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/TTWidgets-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: tt
        CODE_SIGN_ENTITLEMENTS: Config/TTWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: TTShared
        product: TTShared
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  TTMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TTMobileTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/tt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/tt
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: TTMobile
      - package: TTEngine
        product: TTEngine
  # Hosted in the app, so it runs with the app's container and the exchange
  # folder bookmark the document picker left there. Physical iPhone only:
  # ios/scripts/record-icloud-exchange.sh drives it.
  TTMobileDeviceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TTMobileDeviceTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.devicetests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/tt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/tt
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: TTMobile
      - package: TTEngine
        product: TTEngine
      - package: TTSync
        product: TTSyncContract
  # Seeded browsing UI tests on a simulator against the real gomobile engine.
  # ios/scripts/test-ui.sh prepares the disposable workspaces and runs them.
  TTMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TTMobileUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sglavoie.tt.mobile.uitests
        TEST_TARGET_NAME: TTMobile
    dependencies:
      - target: TTMobile
      # The share and widget suite writes captures with the extension's own
      # inbox writer and reads the widget snapshot with the widgets' reader.
      - package: TTShared
        product: TTShared
