version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - errorlint
    - unused
    - errcheck
    - ineffassign
    - staticcheck

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US
  goimports:
    local-prefixes:
      - github.com/sglavoie/tt
  errorlint:
    errorf: true
    errorf-multi: true
    asserts: true
    comparison: true

issues:
  exclude-dirs:
    - vendor
