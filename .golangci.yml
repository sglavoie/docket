version: "2"

# `just lint`. The default set (errcheck, govet, ineffassign, staticcheck,
# unused) plus misspell. An error dropped on purpose is written `_ =`, so the
# intent is in the code; the exclusions below are only the calls whose error
# carries nothing to act on.
linters:
  enable:
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*os.File).Close
        - (*github.com/sglavoie/docket/internal/store.Store).Close
        - os.Remove
        - fmt.Fprintln
    staticcheck:
      checks:
        - all
        # Quick fixes are suggestions for an editor, not findings.
        - -QF*
        # Package comments and naming are not held here.
        - -ST1000
        - -ST1003
        - -ST1020
        - -ST1021
        - -ST1022
  exclusions:
    rules:
      # A test's Close and Remove are cleanup on a temporary directory.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
