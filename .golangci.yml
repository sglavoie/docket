version: '2'

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - errorlint
    - unused
    - errcheck
    - ineffassign
    - staticcheck
    - exhaustive
    - gocyclo
    - unparam
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 30
