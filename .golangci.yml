version: '2'

run:
  # Analysis itself takes seconds, so this is a starvation budget rather than a
  # work budget: another checkout linting or testing on the same machine can
  # stretch a three-second run past five minutes, and a timeout there reports a
  # busy machine as a lint failure. Matches the 20m go test deadline ci.sh sets
  # for the same reason.
  timeout: 20m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - misspell
    - unconvert
    - bodyclose
    - nilerr
    - errorlint
    - unused
    - errcheck
    - ineffassign
    - staticcheck
    - exhaustive
    - gocyclo
    - unparam
    - wastedassign
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    misspell:
      locale: US
    errorlint:
      errorf: true
      errorf-multi: true
      asserts: true
      comparison: true
    exhaustive:
      default-signifies-exhaustive: true
    gocyclo:
      min-complexity: 30
