version: "2"

run:
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports

linters:
  enable:
    - govet
    - misspell
    - unconvert
    - bodyclose
    - nilerr
  disable:
    - errcheck     # Enable later after fixing existing issues
    - unused       # Enable later after cleanup
    - ineffassign  # Enable later after cleanup
    - staticcheck  # Enable later - many style warnings to fix

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  misspell:
    locale: US
